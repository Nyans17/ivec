<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IVEC｜用語集</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2330;--border:#30363d;
  --accent:#e6a817;--accent2:#3b82f6;--accent3:#10b981;--danger:#f87171;
  --purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;
  --text:#e6edf3;--text-muted:#8b949e;--text-dim:#586069;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  font-size:14px;line-height:1.75;
  padding-bottom:calc(120px + var(--safe-bottom));
  -webkit-tap-highlight-color:transparent;
}

/* ── HEADER ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:300;
  height:48px;display:flex;align-items:center;padding:0 1rem;gap:.6rem;
}
.logo{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--accent);letter-spacing:.12em;font-weight:700;text-transform:uppercase;border:1px solid var(--accent);padding:2px 6px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.header-sub{font-size:.78rem;color:var(--text-muted);flex:1}
.header-sub span{color:var(--text);font-weight:500}
.header-home{font-size:.7rem;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 8px;white-space:nowrap;text-decoration:none;flex-shrink:0}

/* ── SEARCH BAR ── */
.search-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:.6rem 1rem;position:sticky;top:48px;z-index:200;
}
.search-inner{position:relative}
.search-input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:.55rem .9rem .55rem 2.2rem;
  color:var(--text);font-size:.88rem;font-family:'Noto Sans JP',sans-serif;
  outline:none;transition:border-color .2s;-webkit-appearance:none;
}
.search-input:focus{border-color:var(--accent2)}
.search-input::placeholder{color:var(--text-dim)}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--text-dim);pointer-events:none}
.search-clear-btn{
  position:absolute;right:.6rem;top:50%;transform:translateY(-50%);
  background:var(--text-dim);border:none;color:var(--bg);
  width:16px;height:16px;border-radius:50%;font-size:.6rem;
  cursor:pointer;display:none;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;
}
.search-clear-btn.show{display:flex}
.search-result-text{font-size:.72rem;color:var(--text-dim);margin-top:.4rem;padding-left:.2rem}

/* ── CATEGORY SCROLL ── */
.cat-nav{
  display:flex;gap:.4rem;overflow-x:auto;
  padding:.6rem 1rem;background:var(--surface2);border-bottom:1px solid var(--border);
  position:sticky;top:calc(48px + 58px);z-index:190;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.cat-nav::-webkit-scrollbar{display:none}
.cat-btn{
  flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  color:var(--text-muted);padding:5px 12px;font-size:.72rem;border-radius:16px;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;
  min-height:30px;transition:all .15s;-webkit-appearance:none;
  display:flex;align-items:center;gap:.3rem;
}
.cat-btn:active{opacity:.75}
.cat-btn.active-all{border-color:var(--accent);color:var(--accent);background:rgba(230,168,23,.1)}
.cat-btn.active-ch4{border-color:var(--accent2);color:var(--accent2);background:rgba(59,130,246,.1)}
.cat-btn.active-ch5a{border-color:var(--accent3);color:var(--accent3);background:rgba(16,185,129,.1)}
.cat-btn.active-ch5b{border-color:var(--teal);color:var(--teal);background:rgba(45,212,191,.1)}
.cat-btn.active-ch5c{border-color:var(--danger);color:var(--danger);background:rgba(248,113,113,.1)}
.cat-dot{width:7px;height:7px;border-radius:50%}
.cnt-badge{font-family:'JetBrains Mono',monospace;font-size:.62rem;opacity:.7}

/* ── SECTION FILTER ── */
.sec-nav{
  display:flex;gap:.35rem;overflow-x:auto;
  padding:.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.sec-nav::-webkit-scrollbar{display:none}
.sec-btn{
  flex-shrink:0;background:var(--surface);border:1px solid var(--border);
  color:var(--text-dim);padding:3px 9px;font-size:.68rem;border-radius:10px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;white-space:nowrap;
  min-height:26px;transition:all .15s;-webkit-appearance:none;
}
.sec-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(230,168,23,.08)}

/* ── CONTAINER ── */
.container{padding:.8rem 1rem 1rem}

/* ── RESULT HEADER ── */
.result-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.8rem;
}
.result-title{font-family:'Noto Serif JP',serif;font-size:1rem;font-weight:700;color:var(--text)}
.result-count{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-dim)}

/* ── TERM LIST ── */
.term-list{display:flex;flex-direction:column;gap:.6rem}

.term-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden;transition:border-color .15s;
}
.term-card.open{border-color:var(--accent2)}
.term-header{
  padding:.85rem 1rem;display:flex;align-items:flex-start;gap:.7rem;
  cursor:pointer;min-height:52px;
}
.term-header:active{background:var(--surface2)}
.term-cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:.3rem}
.term-main{flex:1;min-width:0}
.term-word{font-family:'Noto Serif JP',serif;font-size:.95rem;font-weight:700;color:var(--text);line-height:1.4}
.term-en{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--text-dim);margin-top:.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.3rem}
.term-tag{font-size:.6rem;padding:1px 6px;border-radius:8px;font-weight:700}
.term-arrow{color:var(--text-dim);font-size:.8rem;flex-shrink:0;margin-top:.15rem;transition:transform .2s}
.term-card.open .term-arrow{transform:rotate(90deg);color:var(--accent2)}

.term-body{
  display:none;padding:0 1rem .9rem;
  border-top:1px solid var(--border);background:var(--surface2);
}
.term-card.open .term-body{display:block}
.term-def{font-size:.87rem;color:var(--text);line-height:1.8;padding-top:.8rem}
.term-def strong{color:var(--accent)}
.term-point{
  background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);
  border-radius:8px;padding:.65rem .9rem;margin-top:.7rem;
}
.term-point-lbl{font-size:.65rem;color:var(--accent2);font-weight:700;letter-spacing:.07em;margin-bottom:.25rem}
.term-point-txt{font-size:.84rem;color:#a8c0e0;line-height:1.7}
.term-ref{margin-top:.6rem;font-size:.74rem;color:var(--text-dim)}
.term-ref span{color:var(--text-muted)}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-dim)}
.empty-state .icon{font-size:2rem;margin-bottom:.6rem}

/* ── BOTTOM NAV ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:var(--safe-bottom);
}
.bnav-btn{
  flex:1;border:none;background:transparent;
  color:var(--text-muted);
  padding:10px 4px 8px;
  font-family:'Noto Sans JP',sans-serif;font-size:.62rem;font-weight:500;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
}
.bnav-btn .bicon{font-size:1rem;line-height:1}
.bnav-btn.active{color:var(--accent)}

/* ── COLORS ── */
.dot-all{background:var(--accent)}
.dot-ch4{background:var(--accent2)}
.dot-ch5a{background:var(--accent3)}
.dot-ch5b{background:var(--teal)}
.dot-ch5c{background:var(--danger)}

.tag-ch4{background:rgba(59,130,246,.12);color:#60a5fa}
.tag-ch5a{background:rgba(16,185,129,.12);color:var(--accent3)}
.tag-ch5b{background:rgba(45,212,191,.12);color:var(--teal)}
.tag-ch5c{background:rgba(248,113,113,.12);color:var(--danger)}
.tag-key{background:rgba(230,168,23,.12);color:var(--accent)}
.tag-sec{background:rgba(167,139,250,.12);color:var(--purple)}
.tag-io{background:rgba(251,146,60,.12);color:var(--orange)}
</style>
</head>
<body>

<header>
  <div class="logo">IVEC</div>
  <div class="header-sub">アーキテクトクラス｜<span>用語集</span></div>
  <a href="index.html" class="header-home">🏠 TOP</a>
</header>

<!-- 検索バー -->
<div class="search-bar">
  <div class="search-inner">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="search" placeholder="用語を検索…" oninput="doSearch(this.value)" autocomplete="off">
    <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="search-result-text" id="searchResultText"></div>
</div>

<!-- カテゴリナビ -->
<div class="cat-nav">
  <button class="cat-btn active-all" id="catAll" onclick="filterCat('all',this)">
    <span class="cat-dot dot-all"></span>すべて<span class="cnt-badge" id="cntAll"></span>
  </button>
  <button class="cat-btn" id="catCh4" onclick="filterCat('ch4',this)">
    <span class="cat-dot dot-ch4"></span>第4章<span class="cnt-badge" id="cntCh4"></span>
  </button>
  <button class="cat-btn" id="catCh5a" onclick="filterCat('ch5a',this)">
    <span class="cat-dot dot-ch5a"></span>自動化<span class="cnt-badge" id="cntCh5a"></span>
  </button>
  <button class="cat-btn" id="catCh5b" onclick="filterCat('ch5b',this)">
    <span class="cat-dot dot-ch5b"></span>IoT<span class="cnt-badge" id="cntCh5b"></span>
  </button>
  <button class="cat-btn" id="catCh5c" onclick="filterCat('ch5c',this)">
    <span class="cat-dot dot-ch5c"></span>セキュリティ<span class="cnt-badge" id="cntCh5c"></span>
  </button>
</div>

<!-- 節フィルター -->
<div class="sec-nav">
  <button class="sec-btn active" id="secAll" onclick="filterSec('',this)">全節</button>
  <button class="sec-btn" onclick="filterSec('4.1',this)">4.1</button>
  <button class="sec-btn" onclick="filterSec('4.2',this)">4.2</button>
  <button class="sec-btn" onclick="filterSec('4.3',this)">4.3</button>
  <button class="sec-btn" onclick="filterSec('5.1',this)">5.1</button>
  <button class="sec-btn" onclick="filterSec('5.2',this)">5.2</button>
  <button class="sec-btn" onclick="filterSec('5.3',this)">5.3</button>
</div>

<div class="container">
  <div class="result-header">
    <div class="result-title" id="resultTitle">全用語</div>
    <div class="result-count" id="resultCount"></div>
  </div>
  <div class="term-list" id="termList"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">🔍</div>
    <div>該当する用語が見つかりません</div>
  </div>
</div>

<!-- ボトムナビ -->
<nav class="bottom-nav">
  <button class="bnav-btn active" onclick="goHome()"><span class="bicon">🏠</span>TOP</button>
  <button class="bnav-btn" onclick="scrollToTop()"><span class="bicon">⬆</span>先頭へ</button>
  <button class="bnav-btn" onclick="focusSearch()"><span class="bicon">🔍</span>検索</button>
  <button class="bnav-btn" onclick="openRandom()"><span class="bicon">🎲</span>ランダム</button>
</nav>

<script>
// =====================================================================
// TERMS DATA（同一データ）
// =====================================================================
const TERMS = [
  // ── 4.1 テスト要求分析 ──
  {word:'テスト要求分析',en:'Test Requirements Analysis',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テストプロジェクトへの要求そのものに加えて、テスト対象・テスト対象外の範囲や制約事項などの情報を入手して分析し、<strong>テスト要件として定義するプロセス</strong>。テスト活動のゴール（終了基準・リリース基準など）の根拠となる重要なプロセス。',
   point:'テスト活動のゴールがテスト要求に基づいて定義されていないと、収束に向かわせることが困難になる。'},
  {word:'ステークホルダ',en:'Stakeholder',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テスト要求に関係する関係者の総称。<strong>要求元・利用者・開発者</strong>など役割によって異なる。ユーザ要求の場合は「利用者」、保守要求の場合は「管理者」をインタビュー対象としてアサインする。',
   point:'繰り返し同じステークホルダへヒアリングしないよう、最初に誰から何をヒアリングしたいかを事前に整理することが重要。'},
  {word:'テストベース',en:'Test Basis',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テストの根拠となるドキュメントや成果物。要求仕様書・設計書・ユーザマニュアル等が含まれる。一覧化することで<strong>入手すべき情報の漏れ防止</strong>につながる。開発の状況によって<strong>改変される可能性</strong>があることを考慮して管理する。',
   ref:'関連節：4.1.2・4.2.2'},
  {word:'コンプライアンス情報',en:'Compliance Information',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テスト対象が準拠すべき<strong>法令・規格・標準</strong>に関する情報。仕様書に明示されない<strong>暗黙知</strong>として存在する場合があるため、事前収集が不可欠。',
   point:'コンプライアンス要件は仕様書に暗黙知として明示されない場合がある。規格違反を見逃さないために事前収集が必要。'},
  {word:'不足情報管理表',en:'Missing Information Management',cat:'ch4',sec:'4.1',
   tags:['4.1','成果物'],
   def:'開発中・要件未決定などでヒアリング結果が得られない場合に作成する管理表。<strong>入手の可否・時期・担当者</strong>を設定してタスクとして管理する。受身にならず期限を設けてステークホルダに要求することが重要。'},
  {word:'品質方針',en:'Quality Policy',cat:'ch4',sec:'4.1',
   tags:['4.1','品質'],
   def:'企業や組織がプロジェクトにおける品質の方向性を定めた方針。QMS（品質マネジメントシステム）を適用している組織では品質についての方針やマニュアルが整備されている。テスト計画における<strong>品質目標設定の基準</strong>となる。',
   ref:'ISO 9000（QMS）が関連'},
  {word:'品質目標',en:'Quality Goal',cat:'ch4',sec:'4.1',
   tags:['4.1','品質'],
   def:'テスト活動が達成すべき品質の数値目標。例：「許容できるシステムダウンタイム」「応答性能の閾値」など。<strong>テスト終了判定</strong>にも用いられる。目標値を定義した分析過程は後工程で参照するため記録・構造化が必要。'},
  {word:'テスト対象外範囲',en:'Out-of-Scope',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テストの対象としない範囲。記載が曖昧になりがちな項目であり、「<strong>なぜ対象外か</strong>」「<strong>誰の責務で実施すべきか</strong>（もしくは実施しないのか）」を明確にすることで、検討漏れがあった場合に早い段階で役割分担を調整できる。'},
  {word:'トレーサビリティ',en:'Traceability',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テスト要求がどの情報源（ドキュメント・インタビュー等）に基づいているかを<strong>追跡できる仕組み</strong>。入手したドキュメントの一覧を作成・記録することで、作成したテスト要求の根拠を主張できる。',
   point:'カバレッジとトレーサビリティの確保がテスト要求分析成果物の核心。'},
  {word:'カバレッジ',en:'Coverage',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テスト要求の網羅度。インプット項目と分析結果を<strong>可視化・関連付け</strong>することで確保する。テスト要求分析成果物においてトレーサビリティとともに確保が求められる。'},
  {word:'ISO/IEC 25010',en:'ISO/IEC 25010',cat:'ch4',sec:'4.1',
   tags:['4.1','規格'],
   def:'ソフトウェア品質特性を定義した国際規格。<strong>機能適合性・性能効率性・互換性・使いやすさ・信頼性・セキュリティ・保守性・移植性</strong>の8特性で構成される。テスト観点として活用し、テスト対象が利用される環境と担当するテストレベルを考慮して分析する。'},
  {word:'利用時品質',en:'Quality in Use',cat:'ch4',sec:'4.1',
   tags:['4.1','品質'],
   def:'ISO/IEC 25010の品質モデルの一つ。実際の利用環境でユーザが製品を使用した際に感じる品質。ユーザ寄りのテストアーキテクチャスタイルでは<strong>利用時品質を用いてカバレッジを説明</strong>することができる。'},
  {word:'範囲の深さ',en:'Scope Depth',cat:'ch4',sec:'4.1',
   tags:['4.1','汎用'],
   def:'テスト対象の確認粒度のこと。例えば性能要求に対して<strong>モジュール単位の応答時間</strong>を確認するのか<strong>システム全体の応答時間</strong>を確認するのかは、テストレベルの対象範囲によって決まる。'},
  // ── 4.2 テストアーキテクチャ設計 ──
  {word:'テストアーキテクチャ設計',en:'Test Architecture Design',cat:'ch4',sec:'4.2',
   tags:['4.2','汎用'],
   def:'テスト要求分析の結果からテストの<strong>実現方式の立案</strong>を行うプロセス。テスト対象の品質特性や環境を考慮したテストツール・テスト技法・テストマネジメント方法・テストベンチ（環境）などの選定や定義を行う。'},
  {word:'アーキテクチャスタイル',en:'Architecture Style',cat:'ch4',sec:'4.2',
   tags:['4.2','汎用'],
   def:'テスト対象の品質が確保されることを表すための指標。IVECにおける原則：①テスト要求を実現するため必要な技術として普及しているもの、②テスト要求を実現できることを説明できること、③構造化されていること。テスト要求だけでなく<strong>テストプロジェクトの習熟度</strong>などにも影響を受ける。'},
  {word:'テストポリシー',en:'Test Policy',cat:'ch4',sec:'4.2',
   tags:['4.2','成果物'],
   def:'テスト要求分析の成果物から定義する、テスト全体の方針。アーキテクチャスタイルの選択・構造設計・バランス調整のすべてを貫く方向性を示す。'},
  {word:'QCDMM分析',en:'QCDMM Analysis',cat:'ch4',sec:'4.2',
   tags:['4.2','手法'],
   def:'アーキテクチャスタイルを選択する際に行う総合分析。<strong>Q：品質、C：コスト、D：納期、M：マネジメント、M：マーケット（ターゲット）</strong>の5要素から構成される。',
   point:'QCDMMの5要素を覚えること。最後のMはマーケット（ターゲット）であり、マシンやマニュアルではない点に注意。'},
  {word:'プロダクトリスク',en:'Product Risk',cat:'ch4',sec:'4.2',
   tags:['4.2','汎用'],
   def:'テスト対象のプロダクト・システムに関わるリスク。担当するテストレベルの範囲外、<strong>特に次工程のテストレベルに影響するリスク</strong>は手戻り抑止のために意識する必要がある。'},

// =====================================================================
// STATE
// =====================================================================
let currentCat = 'all';
let currentSec = '';
let searchQuery = '';

function getFiltered() {
  return TERMS.filter(t => {
    const matchCat = currentCat === 'all' || t.cat === currentCat;
    const matchSec = !currentSec || t.sec === currentSec;
    const q = searchQuery.toLowerCase();
    const matchQ = !q ||
      t.word.toLowerCase().includes(q) ||
      (t.en && t.en.toLowerCase().includes(q)) ||
      t.def.toLowerCase().includes(q) ||
      (t.point && t.point.toLowerCase().includes(q));
    return matchCat && matchSec && matchQ;
  });
}

function dotClass(cat){return {ch4:'dot-ch4',ch5a:'dot-ch5a',ch5b:'dot-ch5b',ch5c:'dot-ch5c'}[cat]||'dot-all'}
function tagClass(tag){
  const m={ch4:'tag-ch4',ch5a:'tag-ch5a',ch5b:'tag-ch5b',ch5c:'tag-ch5c','自動化':'tag-ch5a','IoT':'tag-ch5b','セキュリティ':'tag-ch5c','リスク':'tag-sec','重要':'tag-io','メトリクス':'tag-sec','規格':'tag-sec','手法':'tag-sec','成果物':'tag-io','品質':'tag-ch4','汎用':'tag-ch4'};
  return m[tag]||'tag-key';
}

function highlight(text, q) {
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return text.replace(new RegExp(escaped,'gi'), m => `<mark style="background:rgba(230,168,23,.3);color:var(--accent);border-radius:2px;padding:0 1px">${m}</mark>`);
}

function render() {
  const filtered = getFiltered();
  const list = document.getElementById('termList');
  const empty = document.getElementById('emptyState');
  document.getElementById('resultCount').textContent = `${filtered.length}語`;
  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = filtered.map((t,i) => `
    <div class="term-card" id="tc${i}" onclick="toggleCard(this)">
      <div class="term-header">
        <span class="term-cat-dot ${dotClass(t.cat)}"></span>
        <div class="term-main">
          <div class="term-word">${highlight(t.word, searchQuery)}</div>
          ${t.en ? `<div class="term-en">${t.en}</div>` : ''}
          <div class="term-tags">${(t.tags||[]).map(tag=>`<span class="term-tag ${tagClass(tag)}">${tag}</span>`).join('')}</div>
        </div>
        <span class="term-arrow">›</span>
      </div>
      <div class="term-body">
        <div class="term-def">${highlight(t.def, searchQuery)}</div>
        ${t.point ? `<div class="term-point"><div class="term-point-lbl">🎯 学習のポイント</div><div class="term-point-txt">${highlight(t.point, searchQuery)}</div></div>` : ''}
        ${t.ref ? `<div class="term-ref">📎 参考：<span>${t.ref}</span></div>` : ''}
      </div>
    </div>`).join('');
}

function toggleCard(card) {
  card.classList.toggle('open');
}

// =====================================================================
// FILTER
// =====================================================================
const CAT_ACTIVE = {
  all:'active-all',ch4:'active-ch4',ch5a:'active-ch5a',ch5b:'active-ch5b',ch5c:'active-ch5c'
};
const CAT_IDS = {all:'catAll',ch4:'catCh4',ch5a:'catCh5a',ch5b:'catCh5b',ch5c:'catCh5c'};
const CAT_TITLES = {all:'全用語',ch4:'第4章 汎用テスト',ch5a:'5.1 テスト自動化',ch5b:'5.2 IoT関連',ch5c:'5.3 セキュリティテスト'};

function filterCat(cat, btn) {
  currentCat = cat; currentSec = '';
  // reset cat buttons
  Object.keys(CAT_IDS).forEach(k => {
    const el = document.getElementById(CAT_IDS[k]);
    if (el) el.className = 'cat-btn';
  });
  btn.className = 'cat-btn ' + CAT_ACTIVE[cat];
  // reset sec buttons
  document.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('secAll').classList.add('active');
  document.getElementById('resultTitle').textContent = CAT_TITLES[cat]||'全用語';
  render();
  window.scrollTo(0,0);
}

function filterSec(sec, btn) {
  currentSec = sec;
  document.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const secMap = {'':'全節','4.1':'4.1 テスト要求分析','4.2':'4.2 アーキテクチャ設計','4.3':'4.3 テスト評価','5.1':'5.1 テスト自動化','5.2':'5.2 IoT関連','5.3':'5.3 セキュリティテスト'};
  document.getElementById('resultTitle').textContent = sec ? secMap[sec]||sec : (CAT_TITLES[currentCat]||'全用語');
  render();
  window.scrollTo(0,0);
}

// =====================================================================
// SEARCH
// =====================================================================
function doSearch(val) {
  searchQuery = val.trim();
  const clearBtn = document.getElementById('searchClearBtn');
  clearBtn.classList.toggle('show', !!val);
  if (val) {
    document.getElementById('resultTitle').textContent = `検索：「${val}」`;
  } else {
    document.getElementById('resultTitle').textContent = CAT_TITLES[currentCat]||'全用語';
  }
  render();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  searchQuery = '';
  document.getElementById('searchClearBtn').classList.remove('show');
  document.getElementById('resultTitle').textContent = CAT_TITLES[currentCat]||'全用語';
  render();
}

// =====================================================================
// BOTTOM NAV ACTIONS
// =====================================================================
function goHome() { window.location.href = 'index.html'; }
function scrollToTop() { window.scrollTo({top:0,behavior:'smooth'}); }
function focusSearch() {
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(() => document.getElementById('searchInput').focus(), 300);
}
function openRandom() {
  const filtered = getFiltered();
  if (filtered.length === 0) return;
  const rand = filtered[Math.floor(Math.random() * filtered.length)];
  // close all
  document.querySelectorAll('.term-card.open').forEach(c => c.classList.remove('open'));
  // find and open
  const cards = document.querySelectorAll('.term-card');
  cards.forEach(card => {
    const wordEl = card.querySelector('.term-word');
    if (wordEl && wordEl.textContent.trim() === rand.word) {
      card.classList.add('open');
      card.scrollIntoView({behavior:'smooth', block:'center'});
    }
  });
}

// =====================================================================
// COUNTS
// =====================================================================
function updateCounts() {
  document.getElementById('cntAll').textContent = TERMS.length;
  document.getElementById('cntCh4').textContent = TERMS.filter(t=>t.cat==='ch4').length;
  document.getElementById('cntCh5a').textContent = TERMS.filter(t=>t.cat==='ch5a').length;
  document.getElementById('cntCh5b').textContent = TERMS.filter(t=>t.cat==='ch5b').length;
  document.getElementById('cntCh5c').textContent = TERMS.filter(t=>t.cat==='ch5c').length;
}

// =====================================================================
// INIT
// =====================================================================
window.addEventListener('DOMContentLoaded', () => {
  updateCounts();
  document.getElementById('resultTitle').textContent = '全用語';
  render();
});
</script>
</body>
</html>
