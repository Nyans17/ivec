<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IVEC アーキテクトクラス｜模擬試験</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17;--surface:#111827;--surface2:#1a2235;--surface3:#1e2d45;
  --border:#1e3050;--border2:#2a4070;
  --gold:#f0c040;--gold2:#e6a817;--gold-dim:rgba(240,192,64,.12);
  --blue:#4a9eff;--blue2:#3b82f6;--blue-dim:rgba(74,158,255,.1);
  --green:#34d399;--green-dim:rgba(52,211,153,.1);
  --red:#f87171;--red-dim:rgba(248,113,113,.1);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,.1);
  --text:#e8f0fe;--text-muted:#7a9cc8;--text-dim:#3a5070;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(74,158,255,.07),transparent),
    radial-gradient(ellipse 40% 30% at 80% 60%,rgba(167,139,250,.04),transparent);
  color:var(--text);
  font-family:'Noto Sans JP',sans-serif;
  font-size:15px;
  line-height:1.8;
  min-height:100vh;
}

/* ── HEADER ── */
header{
  background:rgba(17,24,39,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 2rem;
  position:sticky;top:0;z-index:200;
  height:60px;
  display:flex;align-items:center;gap:1rem;
}
.logo{
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:var(--gold);letter-spacing:.2em;
  font-weight:700;text-transform:uppercase;
  border:1px solid var(--gold2);padding:4px 10px;border-radius:4px;
  white-space:nowrap;
}
.header-info{font-size:.82rem;color:var(--text-muted)}
.header-info strong{color:var(--text)}
.timer-wrap{
  margin-left:auto;display:flex;align-items:center;gap:.6rem;
}
.timer-label{font-size:.72rem;color:var(--text-muted);letter-spacing:.08em}
.timer{
  font-family:'JetBrains Mono',monospace;
  font-size:1.1rem;color:var(--gold);font-weight:700;
  background:rgba(240,192,64,.08);border:1px solid rgba(240,192,64,.2);
  padding:4px 12px;border-radius:6px;min-width:80px;text-align:center;
}
.timer.warn{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ── LAYOUT ── */
.container{max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 6rem}

/* ── INTRO ── */
.intro-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:3px solid var(--gold2);
  border-radius:12px;
  padding:2rem 2.2rem;
  margin-bottom:2.5rem;
}
.intro-title{
  font-family:'Noto Serif JP',serif;
  font-size:1.5rem;font-weight:700;
  color:var(--text);margin-bottom:.5rem;
}
.intro-meta{
  display:flex;gap:1.5rem;flex-wrap:wrap;
  margin-top:1rem;padding-top:1rem;
  border-top:1px solid var(--border);
}
.meta-item{
  display:flex;align-items:center;gap:.4rem;
  font-size:.82rem;color:var(--text-muted);
}
.meta-item strong{
  font-family:'JetBrains Mono',monospace;
  color:var(--gold);font-size:.88rem;
}
.start-btn{
  margin-top:1.5rem;
  background:linear-gradient(135deg,var(--gold2),#d4920a);
  border:none;color:#000;
  padding:10px 28px;border-radius:8px;
  font-size:.9rem;font-weight:700;
  font-family:'Noto Sans JP',sans-serif;
  cursor:pointer;transition:all .2s;
  letter-spacing:.04em;
}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(230,168,23,.3)}

/* ── PROGRESS ── */
.progress-wrap{
  display:flex;align-items:center;gap:1rem;
  margin-bottom:2rem;
}
.progress-steps{display:flex;gap:.4rem}
.step-dot{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;font-weight:700;
  font-family:'JetBrains Mono',monospace;
  border:2px solid var(--border2);
  color:var(--text-dim);background:var(--surface);
  transition:all .3s;cursor:default;
}
.step-dot.done{background:var(--green);border-color:var(--green);color:#000}
.step-dot.active{background:var(--gold2);border-color:var(--gold);color:#000}
.progress-bar-wrap{flex:1;height:4px;background:var(--surface2);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--gold2));border-radius:4px;transition:width .5s ease}

/* ── EXAM SCREEN ── */
#examScreen{display:none}
#resultScreen{display:none}

/* ── SCENARIO CARD ── */
.scenario-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:1.8rem;
  overflow:hidden;
}
.scenario-header{
  background:var(--surface2);
  border-bottom:1px solid var(--border);
  padding:1rem 1.5rem;
  display:flex;align-items:center;gap:1rem;
}
.scenario-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;
  font-weight:700;padding:3px 10px;border-radius:4px;
  white-space:nowrap;
}
.scenario-badge.q1{background:rgba(74,158,255,.15);color:var(--blue);border:1px solid rgba(74,158,255,.25)}
.scenario-badge.q2{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
.scenario-badge.q3{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.scenario-badge.q4{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.scenario-domain{font-size:.8rem;color:var(--text-muted)}
.scenario-domain strong{color:var(--text)}
.scenario-body{padding:1.5rem}
.scenario-label{
  font-family:'JetBrains Mono',monospace;
  font-size:.65rem;color:var(--blue);
  letter-spacing:.15em;text-transform:uppercase;
  font-weight:700;margin-bottom:.6rem;
}
.scenario-text{
  font-size:.92rem;color:var(--text);
  line-height:1.85;
  background:var(--surface2);
  border:1px solid var(--border);
  border-left:3px solid var(--blue2);
  border-radius:0 8px 8px 0;
  padding:1.1rem 1.3rem;
}
.scenario-text p{margin-bottom:.7rem}
.scenario-text p:last-child{margin-bottom:0}

/* ── QUESTIONS ── */
.questions-wrap{display:flex;flex-direction:column;gap:1.2rem;margin-top:1.5rem}
.question-item{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1.2rem 1.4rem;
}
.q-header{
  display:flex;align-items:baseline;gap:.7rem;
  margin-bottom:.8rem;
}
.q-number{
  font-family:'JetBrains Mono',monospace;
  font-size:.7rem;color:var(--gold);font-weight:700;
  background:var(--gold-dim);border:1px solid rgba(240,192,64,.2);
  padding:2px 8px;border-radius:4px;white-space:nowrap;
}
.q-type-badge{
  font-size:.63rem;padding:2px 7px;border-radius:10px;font-weight:700;
}
.q-type-badge.choice{background:var(--blue-dim);color:var(--blue)}
.q-type-badge.desc{background:var(--red-dim);color:var(--red)}
.q-type-badge.multi{background:var(--purple-dim);color:var(--purple)}
.q-text{
  font-size:.92rem;color:var(--text);
  font-weight:500;line-height:1.75;
  margin-bottom:1rem;
}

/* choice */
.choices{display:flex;flex-direction:column;gap:.45rem}
.choice-btn{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:7px;padding:.6rem 1rem;
  text-align:left;color:var(--text-muted);
  font-size:.87rem;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
  transition:all .15s;
  display:flex;gap:.7rem;align-items:flex-start;
}
.choice-btn:hover:not(:disabled){
  border-color:var(--blue2);color:var(--text);
  background:var(--blue-dim);
}
.choice-lbl{
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;color:var(--blue);font-weight:700;
  flex-shrink:0;margin-top:1px;
}
.choice-btn.correct{border-color:var(--green)!important;background:var(--green-dim)!important;color:var(--text)!important}
.choice-btn.incorrect{border-color:var(--red)!important;background:var(--red-dim)!important}
.choice-btn.revealed{pointer-events:none}

/* multi */
.multi-options{display:flex;flex-direction:column;gap:.4rem}
.multi-opt{
  display:flex;align-items:flex-start;gap:.6rem;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:7px;
  padding:.55rem .9rem;cursor:pointer;transition:all .15s;
}
.multi-opt:hover{border-color:var(--purple);background:var(--purple-dim)}
.multi-opt.selected{border-color:var(--purple);background:var(--purple-dim);color:var(--text)}
.multi-opt.correct-sel{border-color:var(--green)!important;background:var(--green-dim)!important}
.multi-opt.missed{border-color:var(--gold)!important;background:var(--gold-dim)!important}
.multi-opt.wrong-sel{border-color:var(--red)!important;background:var(--red-dim)!important}
.multi-chk{
  width:16px;height:16px;border:2px solid var(--border2);
  border-radius:4px;flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;color:var(--purple);
  background:var(--surface);transition:all .15s;
}
.multi-opt.selected .multi-chk{background:var(--purple);border-color:var(--purple);color:#fff}
.multi-label{font-family:'JetBrains Mono',monospace;font-size:.73rem;color:var(--purple);font-weight:700;margin-right:.2rem;flex-shrink:0}
.multi-text{font-size:.87rem;color:var(--text-muted);line-height:1.6}
.multi-opt.selected .multi-text{color:var(--text)}
.multi-submit{
  margin-top:.8rem;
  background:var(--purple);border:none;color:#fff;
  padding:6px 16px;border-radius:6px;font-size:.8rem;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:700;
  transition:opacity .2s;
}
.multi-submit:hover{opacity:.85}
.multi-submit:disabled{opacity:.4;cursor:default}

/* textarea */
.desc-area{
  width:100%;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:7px;
  padding:.8rem 1rem;color:var(--text);
  font-size:.87rem;font-family:'Noto Sans JP',sans-serif;
  outline:none;resize:vertical;min-height:100px;
  transition:border-color .2s;line-height:1.75;
}
.desc-area:focus{border-color:var(--blue2)}
.show-ans-btn{
  margin-top:.7rem;
  background:var(--red);border:none;color:#fff;
  padding:6px 16px;border-radius:6px;font-size:.8rem;
  cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:700;
  transition:opacity .2s;
}
.show-ans-btn:hover{opacity:.85}

/* answer reveal */
.answer-box{
  margin-top:.9rem;
  background:rgba(52,211,153,.05);
  border:1px solid rgba(52,211,153,.2);
  border-radius:8px;padding:.9rem 1.1rem;display:none;
}
.answer-box.show{display:block}
.answer-box-label{
  font-size:.7rem;color:var(--green);font-weight:700;
  letter-spacing:.08em;margin-bottom:.4rem;
}
.answer-box-text{font-size:.87rem;color:#9fcfb8;line-height:1.8}
.answer-box-text strong{color:var(--green)}

/* nav buttons */
.exam-nav{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:2rem;padding-top:1.5rem;
  border-top:1px solid var(--border);
}
.nav-btn{
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--text-muted);padding:9px 22px;border-radius:8px;
  font-size:.85rem;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;font-weight:500;
  transition:all .2s;
}
.nav-btn:hover{border-color:var(--blue2);color:var(--text)}
.nav-btn.primary{
  background:linear-gradient(135deg,var(--blue2),#2563eb);
  border-color:transparent;color:#fff;font-weight:700;
}
.nav-btn.primary:hover{box-shadow:0 4px 16px rgba(59,130,246,.35);transform:translateY(-1px)}
.nav-btn.finish{
  background:linear-gradient(135deg,var(--gold2),#d4920a);
  border-color:transparent;color:#000;font-weight:700;
}
.nav-btn.finish:hover{box-shadow:0 4px 16px rgba(230,168,23,.35);transform:translateY(-1px)}
.nav-btn:disabled{opacity:.4;cursor:default;transform:none!important;box-shadow:none!important}

/* ── RESULT ── */
.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:3px solid var(--gold2);
  border-radius:12px;padding:2.5rem;
  text-align:center;margin-bottom:2rem;
}
.result-title{
  font-family:'Noto Serif JP',serif;
  font-size:1.4rem;font-weight:700;
  color:var(--text);margin-bottom:1.5rem;
}
.score-ring-wrap{position:relative;display:inline-block;margin:1rem auto}
.score-ring{transform:rotate(-90deg)}
.score-num{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-family:'JetBrains Mono',monospace;
  font-size:2rem;font-weight:700;color:var(--gold);
}
.score-label{font-size:.75rem;color:var(--text-muted);margin-top:.2rem}
.result-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:.8rem;margin-top:1.5rem;text-align:left;
}
.result-item{
  background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;
  padding:.8rem 1rem;
}
.result-item-q{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--text-dim);margin-bottom:.3rem}
.result-item-status{font-size:.82rem;font-weight:700}
.result-item-status.ok{color:var(--green)}
.result-item-status.ng{color:var(--red)}
.result-item-status.partial{color:var(--gold)}
.result-item-status.open{color:var(--text-muted)}
.restart-btn{
  margin-top:1.5rem;
  background:linear-gradient(135deg,var(--gold2),#d4920a);
  border:none;color:#000;padding:10px 28px;border-radius:8px;
  font-size:.9rem;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;transition:all .2s;
}
.restart-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(230,168,23,.3)}

/* ── MISC ── */
.hint-box{
  background:rgba(240,192,64,.06);
  border:1px solid rgba(240,192,64,.2);
  border-radius:8px;padding:.7rem 1rem;margin-bottom:.8rem;
}
.hint-label{font-size:.68rem;color:var(--gold);font-weight:700;letter-spacing:.1em;margin-bottom:.25rem}
.hint-text{font-size:.82rem;color:#d4b060;line-height:1.65}
</style>
</head>
<body>

<header>
  <div class="logo">IVEC</div>
  <div class="header-info">アーキテクトクラス｜<strong>模擬試験</strong></div>
  <div class="timer-wrap">
    <span class="timer-label">残り時間</span>
    <div class="timer" id="timerDisp">60:00</div>
  </div>
</header>

<div class="container">

  <!-- ===== INTRO ===== -->
  <div id="introScreen">
    <div class="intro-card">
      <div class="intro-title">IVECアーキテクトクラス 模擬試験</div>
      <p style="color:var(--text-muted);font-size:.9rem;margin-top:.5rem">実際の試験と同じ「シナリオ形式」の大問4問です。<br>各大問に具体的なプロジェクト背景が与えられ、シラバスの知識を実務に当てはめて回答します。</p>
      <div class="intro-meta">
        <div class="meta-item">大問数：<strong>4問</strong></div>
        <div class="meta-item">小問数：<strong>全16問</strong></div>
        <div class="meta-item">制限時間：<strong>60分</strong></div>
        <div class="meta-item">形式：<strong>四択・複数選択・記述</strong></div>
      </div>
      <div style="margin-top:1.2rem;padding:1rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);font-size:.85rem;color:var(--text-muted);line-height:1.8">
        📋 <strong style="color:var(--gold)">大問の構成</strong><br>
        大問1：医療機器メーカー（テスト要求分析）<br>
        大問2：ECサイトリニューアル（テストアーキテクチャ設計）<br>
        大問3：製造業IoT導入プロジェクト（テスト評価）<br>
        大問4：金融システム（セキュリティテスト）
      </div>
      <button class="start-btn" onclick="startExam()">▶ 試験を開始する</button>
    </div>
  </div>

  <!-- ===== EXAM ===== -->
  <div id="examScreen">
    <div class="progress-wrap">
      <div class="progress-steps" id="stepDots"></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
    <div id="questionArea"></div>
    <div class="exam-nav">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)" disabled>← 前の大問</button>
      <span style="font-size:.8rem;color:var(--text-dim)" id="pageLabel"></span>
      <button class="nav-btn primary" id="nextBtn" onclick="navigate(1)">次の大問 →</button>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="resultScreen">
    <div class="result-card">
      <div class="result-title">試験結果</div>
      <div class="score-ring-wrap">
        <svg class="score-ring" width="140" height="140" viewBox="0 0 140 140">
          <circle cx="70" cy="70" r="58" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="10"/>
          <circle cx="70" cy="70" r="58" fill="none" stroke="url(#scoreGrad)" stroke-width="10"
            stroke-linecap="round" id="scoreArc" stroke-dasharray="364.4" stroke-dashoffset="364.4"/>
          <defs>
            <linearGradient id="scoreGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#f0c040"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="score-num" id="scoreNum">--</div>
      </div>
      <div class="score-label" id="scoreLabel"></div>
      <div class="result-grid" id="resultGrid"></div>
      <div style="margin-top:1.5rem;padding:1rem;background:var(--surface2);border-radius:8px;border:1px solid var(--border);font-size:.85rem;color:var(--text-muted);text-align:left;line-height:1.8" id="resultAdvice"></div>
      <button class="restart-btn" onclick="restartExam()">↺ もう一度挑戦する</button>
    </div>
  </div>

</div><!-- /container -->

<script>
// =====================================================================
// DATA
// =====================================================================
const EXAM = [
  // ── 大問1 ──
  {
    id:'Q1',
    badge:'大問 1',
    badgeClass:'q1',
    domain:'テスト要求分析（4.1）',
    scenario:`
<p>あなたはIT検証会社のアーキテクトとして、大手医療機器メーカーA社から新製品「在宅向け血糖測定スマートデバイス」のシステムテストを受託した。</p>
<p>本製品はスマートフォンアプリと連携し、クラウドサーバーに血糖値データを送信・管理する。対象ユーザーは高齢者から若年層まで幅広い。開発はウォーターフォール型で、現在要件定義フェーズが完了したばかり。テストレベルはシステムテストのみ担当する。</p>
<p>A社から受け取った資料は「要件定義書（v1.2）」「プロジェクト計画書」「ハードウェア仕様書」の3点。しかし、セキュリティ・個人情報保護方針に関する資料はまだ提供されておらず、開発進捗状況も不明である。</p>`,
    questions:[
      {
        id:'Q1-1',type:'choice',
        text:'テスト要求分析の準備フェーズにおいて、セキュリティ・個人情報保護方針の資料がまだ入手できていない状況への対処として最も適切なものはどれか。',
        choices:['資料が揃うまでテスト要求分析の準備を中断し待機する','不足情報として一覧化し、入手の可否・時期・担当者を設定してタスク管理し、A社に期限を設けて要求する','要件定義書の内容から推測してセキュリティ要求を仮決めし、後で修正する','セキュリティ・個人情報保護の観点はテスト対象外として成果物に明記する'],
        correct:1,
        answer:'不足情報を一覧化し「いつまでに」入手するかを設定して、受身にならずステークホルダへ積極的に要求することが正しい対処。中断したり推測で進めることは不適切。'
      },

// =====================================================================
// STATE
// =====================================================================
let currentQ = 0;
let answers = {};   // {qId: {type, value, scored}}
let timerInterval = null;
let timeLeft = 3600; // 60 min
let examStarted = false;

// =====================================================================
// TIMER
// =====================================================================
function startTimer(){
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){ clearInterval(timerInterval); finishExam(); }
  },1000);
}
function updateTimerDisplay(){
  const m=Math.floor(timeLeft/60), s=timeLeft%60;
  const disp=document.getElementById('timerDisp');
  disp.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(timeLeft<=300) disp.classList.add('warn'); else disp.classList.remove('warn');
}

// =====================================================================
// FLOW
// =====================================================================
function startExam(){
  document.getElementById('introScreen').style.display='none';
  document.getElementById('examScreen').style.display='block';
  examStarted=true;
  buildStepDots();
  renderQuestion(0);
  startTimer();
}

function buildStepDots(){
  const wrap=document.getElementById('stepDots');
  wrap.innerHTML='';
  EXAM.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='step-dot'+(i===0?' active':'');
    d.id='dot'+i;
    d.textContent=i+1;
    wrap.appendChild(d);
  });
}

function updateDots(idx){
  EXAM.forEach((_,i)=>{
    const d=document.getElementById('dot'+i);
    d.className='step-dot'+(i<idx?'done':i===idx?' active':'');
  });
  document.getElementById('progressFill').style.width=((idx/EXAM.length)*100)+'%';
}

function navigate(dir){
  const newIdx=currentQ+dir;
  if(newIdx<0||newIdx>=EXAM.length) return;
  currentQ=newIdx;
  renderQuestion(currentQ);
}

function renderQuestion(idx){
  updateDots(idx);
  const q=EXAM[idx];
  document.getElementById('pageLabel').textContent=`大問 ${idx+1} / ${EXAM.length}`;
  document.getElementById('prevBtn').disabled=(idx===0);
  const nextBtn=document.getElementById('nextBtn');
  if(idx===EXAM.length-1){
    nextBtn.textContent='試験を終了する';
    nextBtn.className='nav-btn finish';
    nextBtn.onclick=finishExam;
  } else {
    nextBtn.textContent='次の大問 →';
    nextBtn.className='nav-btn primary';
    nextBtn.onclick=()=>navigate(1);
  }

  const area=document.getElementById('questionArea');
  area.innerHTML='';

  // scenario
  const sc=document.createElement('div');
  sc.className='scenario-card';
  sc.innerHTML=`
    <div class="scenario-header">
      <span class="scenario-badge ${q.badgeClass}">${q.badge}</span>
      <span class="scenario-domain">領域：<strong>${q.domain}</strong></span>
    </div>
    <div class="scenario-body">
      <div class="scenario-label">シナリオ</div>
      <div class="scenario-text">${q.scenario}</div>
      <div class="questions-wrap">${q.questions.map(renderQItem).join('')}</div>
    </div>`;
  area.appendChild(sc);

  // restore answers
  q.questions.forEach(qi=>{
    const saved=answers[qi.id];
    if(!saved) return;
    if(qi.type==='choice') restoreChoice(qi, saved);
    if(qi.type==='multi') restoreMulti(qi, saved);
    if(qi.type==='desc') restoreDesc(qi, saved);
  });
}

function renderQItem(qi){
  if(qi.type==='choice') return renderChoice(qi);
  if(qi.type==='multi') return renderMulti(qi);
  if(qi.type==='desc') return renderDesc(qi);
  return '';
}

function renderChoice(qi){
  const opts=qi.choices.map((c,i)=>`
    <button class="choice-btn" onclick="pickChoice('${qi.id}',${i},${qi.correct})" id="c_${qi.id}_${i}">
      <span class="choice-lbl">${['A','B','C','D'][i]}</span>${c}
    </button>`).join('');
  return `
    <div class="question-item" id="qi_${qi.id}">
      <div class="q-header">
        <span class="q-number">${qi.id}</span>
        <span class="q-type-badge choice">四択</span>
      </div>
      <div class="q-text">${qi.text}</div>
      <div class="choices">${opts}</div>
      <div class="answer-box" id="ans_${qi.id}">
        <div class="answer-box-label">✅ 解説</div>
        <div class="answer-box-text">${qi.answer}</div>
      </div>
    </div>`;
}

function renderMulti(qi){
  const opts=qi.choices.map((c,i)=>`
    <div class="multi-opt" onclick="toggleMulti('${qi.id}',${i})" id="mo_${qi.id}_${i}">
      <div class="multi-chk" id="mc_${qi.id}_${i}">✓</div>
      <span class="multi-label">${['A','B','C','D','E'][i]}</span>
      <span class="multi-text">${c}</span>
    </div>`).join('');
  return `
    <div class="question-item" id="qi_${qi.id}">
      <div class="q-header">
        <span class="q-number">${qi.id}</span>
        <span class="q-type-badge multi">複数選択</span>
      </div>
      <div class="q-text">${qi.text}</div>
      <div class="multi-options">${opts}</div>
      <button class="multi-submit" id="msub_${qi.id}" onclick="submitMulti('${qi.id}')">回答を確定する</button>
      <div class="answer-box" id="ans_${qi.id}">
        <div class="answer-box-label">✅ 解説</div>
        <div class="answer-box-text">${qi.answer}</div>
      </div>
    </div>`;
}

function renderDesc(qi){
  return `
    <div class="question-item" id="qi_${qi.id}">
      <div class="q-header">
        <span class="q-number">${qi.id}</span>
        <span class="q-type-badge desc">記述</span>
      </div>
      <div class="hint-box">
        <div class="hint-label">💡 実務で考えるヒント</div>
        <div class="hint-text">「自分の現場ならどうしていたか」を思い浮かべながら、シラバスの用語・概念で言語化してみてください。</div>
      </div>
      <div class="q-text">${qi.text}</div>
      <textarea class="desc-area" id="da_${qi.id}" placeholder="回答を入力してください…" oninput="saveDesc('${qi.id}')"></textarea>
      <button class="show-ans-btn" onclick="showAns('${qi.id}')">解答例を見る</button>
      <div class="answer-box" id="ans_${qi.id}">
        <div class="answer-box-label">📝 解答例</div>
        <div class="answer-box-text" style="white-space:pre-wrap">${qi.answer}</div>
      </div>
    </div>`;
}

// =====================================================================
// INTERACTIONS
// =====================================================================
function pickChoice(qid, selected, correct){
  if(answers[qid]?.locked) return;
  const isCorrect=(selected===correct);
  EXAM.flatMap(q=>q.questions).find(q=>q.id===qid)?.choices.forEach((_,i)=>{
    const btn=document.getElementById(`c_${qid}_${i}`);
    if(!btn) return;
    btn.disabled=true; btn.classList.add('revealed');
    if(i===correct) btn.classList.add('correct');
  });
  const selBtn=document.getElementById(`c_${qid}_${selected}`);
  if(!isCorrect && selBtn) selBtn.classList.add('incorrect');
  document.getElementById(`ans_${qid}`)?.classList.add('show');
  answers[qid]={type:'choice',value:selected,scored:isCorrect?1:0,locked:true};
}

let multiState={};
function toggleMulti(qid, idx){
  if(answers[qid]?.locked) return;
  if(!multiState[qid]) multiState[qid]=new Set();
  const s=multiState[qid];
  const opt=document.getElementById(`mo_${qid}_${idx}`);
  if(s.has(idx)){ s.delete(idx); opt?.classList.remove('selected'); }
  else { s.add(idx); opt?.classList.add('selected'); }
}

function submitMulti(qid){
  if(answers[qid]?.locked) return;
  const qi=EXAM.flatMap(q=>q.questions).find(q=>q.id===qid);
  if(!qi) return;
  const sel=multiState[qid]||new Set();
  const correct=new Set(qi.correctSet);
  const sub=document.getElementById(`msub_${qid}`);
  if(sub){ sub.disabled=true; }

  let score=0;
  const correctArr=[...correct], selArr=[...sel];
  qi.choices.forEach((_,i)=>{
    const opt=document.getElementById(`mo_${qid}_${i}`);
    if(!opt) return;
    opt.style.pointerEvents='none';
    const inSel=sel.has(i), inCorrect=correct.has(i);
    if(inCorrect && inSel){ opt.classList.add('correct-sel'); score++; }
    else if(inCorrect && !inSel){ opt.classList.add('missed'); }
    else if(!inCorrect && inSel){ opt.classList.add('wrong-sel'); score--; }
  });
  const maxScore=correct.size;
  const pct=Math.max(0,score)/maxScore;
  document.getElementById(`ans_${qid}`)?.classList.add('show');
  answers[qid]={type:'multi',value:selArr,scored:pct,locked:true};
}

function saveDesc(qid){
  const val=document.getElementById(`da_${qid}`)?.value||'';
  if(!answers[qid]?.locked){
    answers[qid]={type:'desc',value:val,scored:null};
  }
}

function showAns(qid){
  document.getElementById(`ans_${qid}`)?.classList.add('show');
  if(!answers[qid]) answers[qid]={type:'desc',value:'',scored:'open'};
}

function restoreChoice(qi, saved){
  if(!saved.locked) return;
  qi.choices.forEach((_,i)=>{
    const btn=document.getElementById(`c_${qi.id}_${i}`);
    if(!btn) return;
    btn.disabled=true; btn.classList.add('revealed');
    if(i===qi.correct) btn.classList.add('correct');
  });
  const selBtn=document.getElementById(`c_${qi.id}_${saved.value}`);
  if(saved.value!==qi.correct && selBtn) selBtn.classList.add('incorrect');
  document.getElementById(`ans_${qi.id}`)?.classList.add('show');
}
function restoreMulti(qi, saved){
  if(!saved.locked) return;
  const sel=new Set(saved.value);
  multiState[qi.id]=sel;
  const correct=new Set(qi.correctSet);
  qi.choices.forEach((_,i)=>{
    const opt=document.getElementById(`mo_${qi.id}_${i}`);
    if(!opt) return;
    opt.style.pointerEvents='none';
    const inSel=sel.has(i), inCorrect=correct.has(i);
    if(inCorrect && inSel) opt.classList.add('correct-sel');
    else if(inCorrect && !inSel) opt.classList.add('missed');
    else if(!inCorrect && inSel) opt.classList.add('wrong-sel');
  });
  const sub=document.getElementById(`msub_${qi.id}`);
  if(sub) sub.disabled=true;
  document.getElementById(`ans_${qi.id}`)?.classList.add('show');
}
function restoreDesc(qi, saved){
  const ta=document.getElementById(`da_${qi.id}`);
  if(ta) ta.value=saved.value||'';
  if(saved.scored==='open') document.getElementById(`ans_${qi.id}`)?.classList.add('show');
}

// =====================================================================
// FINISH
// =====================================================================
function finishExam(){
  clearInterval(timerInterval);
  document.getElementById('examScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  buildResult();
}

function buildResult(){
  // collect all questions
  const allQ=EXAM.flatMap(q=>q.questions);
  let totalPoints=0, maxPoints=0;
  const grid=document.getElementById('resultGrid');
  grid.innerHTML='';

  allQ.forEach(qi=>{
    const ans=answers[qi.id];
    maxPoints+=1;
    let statusText='', statusClass='', pts=0;

    if(!ans){ statusText='未回答'; statusClass='ng'; }
    else if(qi.type==='choice'){
      pts=ans.scored||0; totalPoints+=pts;
      statusText=pts===1?'正解 ✓':'不正解 ✗'; statusClass=pts===1?'ok':'ng';
    } else if(qi.type==='multi'){
      pts=ans.scored||0; totalPoints+=pts;
      statusText=pts>=1?'正解 ✓':pts>0?'部分正解△':'不正解 ✗';
      statusClass=pts>=1?'ok':pts>0?'partial':'ng';
    } else {
      statusText='記述（自己採点）'; statusClass='open';
    }

    const item=document.createElement('div');
    item.className='result-item';
    item.innerHTML=`<div class="result-item-q">${qi.id}</div><div class="result-item-status ${statusClass}">${statusText}</div>`;
    grid.appendChild(item);
  });

  // score (out of choice+multi only)
  const scorableQ=allQ.filter(q=>q.type!=='desc');
  const scorableMax=scorableQ.length;
  const pct=scorableMax>0?Math.round((totalPoints/scorableMax)*100):0;

  document.getElementById('scoreNum').textContent=pct+'%';
  document.getElementById('scoreLabel').textContent=`選択・複数選択問題 ${scorableMax}問中 正解率`;

  // arc
  const arc=document.getElementById('scoreArc');
  const circumference=364.4;
  const offset=circumference*(1-pct/100);
  setTimeout(()=>{ arc.style.transition='stroke-dashoffset 1.2s ease'; arc.style.strokeDashoffset=offset; },100);

  // advice
  const adviceEl=document.getElementById('resultAdvice');
  let advice='';
  if(pct>=80) advice='<strong style="color:var(--green)">素晴らしい結果です！</strong> 記述問題の解答例と自分の回答を照らし合わせ、シラバスの用語をより正確に使えているか確認しましょう。';
  else if(pct>=60) advice='<strong style="color:var(--gold)">あと一歩です。</strong> 間違えた問題の解説を読み、該当する教材（4.1〜4.3・第5章）の該当節を復習しましょう。シナリオと概念の結びつきを強化することが鍵です。';
  else advice='<strong style="color:var(--red)">知識の言語化を強化しましょう。</strong> 実務で経験していることをシラバスの用語で表現する練習が効果的です。各大問の解説を丁寧に読み、教材で基礎を再確認してから再挑戦してみてください。';
  adviceEl.innerHTML='💬 ' + advice;
}

function restartExam(){
  answers={};
  multiState={};
  currentQ=0;
  timeLeft=3600;
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('examScreen').style.display='block';
  buildStepDots();
  renderQuestion(0);
  updateTimerDisplay();
  startTimer();
}
</script>
